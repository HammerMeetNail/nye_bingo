openapi: 3.0.0
info:
  title: Year of Bingo API
  description: |
    Programmatic access to Year of Bingo cards.
    
    Authentication is performed via the `Authorization` header using Bearer tokens.
    Tokens can be generated in your profile settings.
    
    Example: `Authorization: Bearer yob_abc123...`

    Note: Some endpoints (e.g. AI generation) require an authenticated browser session cookie and do not accept API tokens.
  version: 1.8.3
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque Token
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
  schemas:
    FeatureEntitlements:
      type: object
      properties:
        templates:
          type: boolean
        edit_after_finalize:
          type: boolean
        ai_enhancements:
          type: boolean
    BillingStatus:
      type: object
      properties:
        billing_enabled:
          type: boolean
        is_premium:
          type: boolean
        features:
          $ref: '#/components/schemas/FeatureEntitlements'
        plan:
          type: string
          enum: [free, premium]
        status:
          type: string
          enum: [inactive, active, trialing, past_due, canceled]
        source:
          type: string
          enum: [none, stripe_subscription, stripe_lifetime, code, grant]
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
    CheckoutSessionResponse:
      type: object
      properties:
        url:
          type: string
    PortalSessionResponse:
      type: object
      properties:
        url:
          type: string
    RedeemCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    BingoCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        year:
          type: integer
        title:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        grid_size:
          type: integer
          description: Square grid size (2-5)
          enum: [2, 3, 4, 5]
        header_text:
          type: string
          description: Header text rendered as one character per column
        has_free_space:
          type: boolean
        free_space_position:
          type: integer
          nullable: true
          description: Reserved FREE cell position in 0..(grid_size^2-1) when enabled
        is_active:
          type: boolean
        is_finalized:
          type: boolean
        visible_to_friends:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/BingoItem'
    BingoItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        position:
          type: integer
          description: 0..(grid_size^2-1); FREE position is reserved when enabled
        content:
          type: string
        is_completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        proof_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    CardTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          nullable: true
        grid_size:
          type: integer
          enum: [2, 3, 4, 5]
        header_text:
          type: string
        has_free_space:
          type: boolean
        default_visible_to_friends:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CardTemplateItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
    TemplateWithItems:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/CardTemplate'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardTemplateItem'
    CardConflictResponse:
      type: object
      properties:
        error:
          type: string
        conflict:
          type: object
          properties:
            year:
              type: integer
            title:
              type: string
        suggested_title:
          type: string
    PublicBingoCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        year:
          type: integer
        title:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        grid_size:
          type: integer
          description: Square grid size (2-5)
          enum: [2, 3, 4, 5]
        header_text:
          type: string
        has_free_space:
          type: boolean
        free_space_position:
          type: integer
          nullable: true
        is_finalized:
          type: boolean
    PublicBingoItem:
      type: object
      properties:
        position:
          type: integer
        content:
          type: string
        is_completed:
          type: boolean
    SharedCard:
      type: object
      properties:
        card:
          $ref: '#/components/schemas/PublicBingoCard'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicBingoItem'
    CardShareStatus:
      type: object
      properties:
        enabled:
          type: boolean
        expired:
          type: boolean
        url:
          type: string
          description: Share token used to build the share URL (/s/{token}, /share/{token}; legacy /#share/{token})
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_accessed_at:
          type: string
          format: date-time
          nullable: true
        access_count:
          type: integer
        message:
          type: string
    CardStats:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        year:
          type: integer
        total_items:
          type: integer
        completed_items:
          type: integer
        completion_rate:
          type: number
        bingos_achieved:
          type: integer
        first_completion:
          type: string
          format: date-time
          nullable: true
        last_completion:
          type: string
          format: date-time
          nullable: true
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        ai_free_generations_used:
          type: integer
        searchable:
          type: boolean
    AccountDeleteRequest:
      type: object
      required:
        - confirm_username
        - password
        - confirm
      properties:
        confirm_username:
          type: string
        password:
          type: string
        confirm:
          type: boolean
    AccountMessage:
      type: object
      properties:
        message:
          type: string
    BlockedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        blocked_at:
          type: string
          format: date-time
    FriendInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inviter_user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [friend_request_received, friend_request_accepted, friend_bingo, friend_new_card]
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_username:
          type: string
          nullable: true
        friendship_id:
          type: string
          format: uuid
          nullable: true
        card_id:
          type: string
          format: uuid
          nullable: true
        card_title:
          type: string
          nullable: true
        card_year:
          type: integer
          nullable: true
        bingo_count:
          type: integer
          nullable: true
        in_app_delivered:
          type: boolean
        email_delivered:
          type: boolean
        email_sent_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationSettings:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        in_app_enabled:
          type: boolean
        in_app_friend_request_received:
          type: boolean
        in_app_friend_request_accepted:
          type: boolean
        in_app_friend_bingo:
          type: boolean
        in_app_friend_new_card:
          type: boolean
        email_enabled:
          type: boolean
        email_friend_request_received:
          type: boolean
        email_friend_request_accepted:
          type: boolean
        email_friend_bingo:
          type: boolean
        email_friend_new_card:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReminderSettings:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email_enabled:
          type: boolean
        daily_email_cap:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CardCheckinReminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        frequency:
          type: string
        schedule:
          type: object
          additionalProperties: true
        include_image:
          type: boolean
        include_recommendations:
          type: boolean
        next_send_at:
          type: string
          format: date-time
          nullable: true
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CardCheckinSummary:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
        card_title:
          type: string
          nullable: true
        card_year:
          type: integer
        is_finalized:
          type: boolean
        is_archived:
          type: boolean
        has_free_space:
          type: boolean
        grid_size:
          type: integer
        checkin:
          $ref: '#/components/schemas/CardCheckinReminder'
          nullable: true
    GoalReminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        kind:
          type: string
        schedule:
          type: object
          additionalProperties: true
        next_send_at:
          type: string
          format: date-time
          nullable: true
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GoalReminderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        kind:
          type: string
        schedule:
          type: object
          additionalProperties: true
        next_send_at:
          type: string
          format: date-time
          nullable: true
        last_sent_at:
          type: string
          format: date-time
          nullable: true
        card_title:
          type: string
          nullable: true
        card_year:
          type: integer
        item_text:
          type: string
security:
  - bearerAuth: []
paths:
  /auth/me:
    get:
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  is_premium:
                    type: boolean
                  features:
                    $ref: '#/components/schemas/FeatureEntitlements'
  /auth/{provider}/start:
    get:
      summary: Start OAuth provider login
      security:
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: google
        - name: next
          in: query
          required: false
          schema:
            type: string
            example: "#dashboard"
      responses:
        '302':
          description: Redirect to provider authorization URL
  /auth/{provider}/callback:
    get:
      summary: OAuth provider callback
      security:
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: google
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to SPA route after login
  /auth/{provider}/complete:
    post:
      summary: Complete provider signup
      security:
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - searchable
              properties:
                username:
                  type: string
                searchable:
                  type: boolean
      responses:
        '201':
          description: User created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  next:
                    type: string
                    nullable: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /account/export:
    get:
      summary: Export account data as ZIP
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ZIP archive of account data
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Token authentication not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /account:
    delete:
      summary: Delete account
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMessage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Token authentication not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /blocks:
    get:
      summary: List blocked users
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Blocked users
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockedUser'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Block a user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: User already blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /blocks/{id}:
    delete:
      summary: Unblock a user
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Block not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /friends/invites:
    get:
      summary: List active friend invites
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendInvite'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Create a friend invite
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    $ref: '#/components/schemas/FriendInvite'
                  url:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Invite limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /friends/invites/{id}/revoke:
    delete:
      summary: Revoke a friend invite
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /friends/invites/accept:
    post:
      summary: Accept a friend invite
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviter:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Invite blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: Already friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /notifications:
    get:
      summary: List notifications
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: unread
          schema:
            type: string
          description: Set to 1 to return only unread notifications
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: before
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete all notifications
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Notifications deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /notifications/{id}:
    delete:
      summary: Delete notification
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
